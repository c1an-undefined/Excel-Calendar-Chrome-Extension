<html>
    <head>
        <meta charset="UTF-8">
    </head>
        <body style="font-family: sans-serif; padding: 10px; width: 260px;">

        <h3>Excel → Calendar</h3>

        <label>Select Excel File</label>
        <input type="file" id="file" style="width: 100%; margin-bottom: 10px;" />

        <label>Filter by lecturer (optional)</label>
        <input type="text" id="username" placeholder="e.g. Gallagher" style="width: 100%; margin-bottom: 10px;" />

        <button id="parse-btn" style="width: 100%; margin-bottom: 10px;">Load Events</button>

        <p id="parse-status" style="margin-top: 8px; font-size: 12px; color: #444;">
            No file parsed.
        </p>

        <select id="event-dropdown" style="width: 100%; margin-bottom: 10px;">
            <option value="">-- Select an event --</option>
        </select>

        <button id="add-one" style="width: 100%; margin-bottom: 10px;">Add Selected</button>
        <button id="add-all" style="width: 100%; margin-bottom: 10px;">Add All</button>

        <div id="status" style="margin-top: 10px; font-size: 12px; color: #444;"></div>

        <script src="xlsx.full.min.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
